[package]
name = "realtime-core"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
authors = ["Abraham Joongwhan Ahn"]
description = "Transport-neutral realtime delivery, recovery, subscription, retry, and liveness state"
license = "MIT"
repository = "https://github.com/abrahamahn/realtime-core"
homepage = "https://github.com/abrahamahn/realtime-core"
readme = "README.md"
keywords = ["realtime", "subscriptions", "recovery", "websocket", "events"]
categories = ["data-structures", "network-programming"]
exclude = ["target/"]

[lib]
path = "src/lib.rs"

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
